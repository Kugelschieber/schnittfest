{{- $headline := default (copy .Page .Content "headline") "Häufige Fragen" -}}
{{- $text := copy .Page .Content "text" -}}

<section class="faq" id="faq" itemscope itemtype="https://schema.org/FAQPage" data-shifu-element="{{ .Content.Position }}">
    <div class="faq__inner">
        <div class="faq__head" data-component="reveal">
            <h2 class="section-title"><span class="section-title__nr" aria-hidden="true"></span>{{ $headline }}</h2>
            {{ with $text }}<div class="faq__text">{{ html . }}</div>{{ end }}
        </div>
        <div class="faq__list">
            {{ .CMS.Render .Args .Page (fmt "%s.items" .Content.Position) (index .Content.Content "items") }}
            <slot name="{{ .Content.Position }}/items"></slot>
        </div>
    </div>
</section>

{{- $title := copy .Page .Content "h2" -}}
{{- $text := copy .Page .Content "text" -}}
{{- $video := get .Content "video" -}}

<article class="take" data-component="reveal" data-shifu-element="{{ .Content.Position }}">
    <div class="take__info">
        <span class="take__label" aria-hidden="true">Take</span>
        {{ with $title }}<h3 class="take__title">{{ . }}</h3>{{ end }}
        {{ with $text }}<p class="take__text">{{ . }}</p>{{ end }}
    </div>
    <div class="take__screen">
        {{ with $video }}
        <iframe class="take__video" src="{{ . }}" title="{{ default $title "Video" }}" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
        {{ end }}
    </div>
</article>
